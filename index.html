<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Willen's 21st — Casino Royale VIP Ticket</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f1a14 0%, #09090b 100%);
      font-family: system-ui, -apple-system, sans-serif;
      color: #f5d78e;
      padding: 20px;
      overflow-x: hidden;
    }

    .scene {
      width: min(92vw, 760px);
      aspect-ratio: 2.25 / 1;
      perspective: 1400px;
      cursor: pointer;
    }

    .ticket {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ticket.is-flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.75), 0 0 25px rgba(212, 175, 55, 0.25);
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .face-back {
      transform: rotateY(180deg);
    }

    .hint {
      margin-top: 18px;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.85;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="scene" onclick="document.getElementById('ticket').classList.toggle('is-flipped')">
    <div class="ticket" id="ticket">
      <div class="face face-front">
        <img src="front.png" alt="Willen's 21st Ticket Front" />
      </div>
      <div class="face face-back">
        <img src="back.png" alt="Willen's 21st Ticket Back" />
      </div>
    </div>
  </div>

  <p class="hint">Tap or click ticket to flip</p>

</body>
</html>
